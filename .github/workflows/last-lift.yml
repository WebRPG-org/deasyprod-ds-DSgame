name: Last Lift

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  story:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check
      - run: npm test

  mobile-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Play the mobile episode
        run: |
          python -m http.server 8000 --bind 127.0.0.1 > /tmp/last-lift-server.log 2>&1 &
          game_server_pid=$!
          trap 'kill "$game_server_pid"' EXIT
          python tests/mobile_smoke.py --chromium playwright --artifacts test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: last-lift-browser-results
          path: test-results/
